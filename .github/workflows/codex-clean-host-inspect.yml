name: Codex Clean-Host Context Inspection

on:
  workflow_dispatch:
    inputs:
      codex_version:
        description: Exact @openai/codex package version
        required: true
        type: string
      codex_binary_sha256:
        description: Expected SHA-256 of the Linux x64 native Codex executable
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect-context:
    name: Capture redacted context evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CODEX_VERSION: ${{ inputs.codex_version }}
      CODEX_BINARY_SHA256: ${{ inputs.codex_binary_sha256 }}
      INSPECT_IMAGE: spectra-codex-clean-host:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate pinned inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CODEX_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          [[ "$CODEX_BINARY_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Stage the minimal build context
        shell: bash
        env:
          BUILD_ROOT: ${{ runner.temp }}/spectra-codex-clean-host-build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          mkdir "$BUILD_ROOT"
          install -m 0644 .github/codex-clean-host/Dockerfile "$BUILD_ROOT/Dockerfile"
          install -m 0555 adapters/codex/codex-executor.py "$BUILD_ROOT/codex-executor.py"
          test "$(find "$BUILD_ROOT" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Build the pinned diagnostic image
        shell: bash
        env:
          BUILD_ROOT: ${{ runner.temp }}/spectra-codex-clean-host-build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --pull --no-cache \
            --build-arg "CODEX_VERSION=$CODEX_VERSION" \
            --build-arg "CODEX_BINARY_SHA256=$CODEX_BINARY_SHA256" \
            --tag "$INSPECT_IMAGE" \
            "$BUILD_ROOT"

      - name: Run and sanitize the network-disabled inspection
        shell: bash
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/spectra-codex-clean-host-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          WORKFLOW_COMMIT: ${{ github.sha }}
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
        run: |
          set -euo pipefail
          umask 077
          python3 .github/codex-clean-host/run-inspection.py \
            --image "$INSPECT_IMAGE" \
            --expected-sha256 "$CODEX_BINARY_SHA256" \
            --evidence-root "$EVIDENCE_ROOT" \
            --codex-version "$CODEX_VERSION" \
            --workflow-commit "$WORKFLOW_COMMIT" \
            --runner-os "$RUNNER_OS_NAME" \
            --runner-arch "$RUNNER_ARCH_NAME"

      - name: Upload redacted evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/spectra-codex-clean-host-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          name: codex-clean-host-inspect-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.EVIDENCE_ROOT }}/inspect-context.json
            ${{ env.EVIDENCE_ROOT }}/provenance.json
          if-no-files-found: error
          retention-days: 3

      - name: Remove the local diagnostic image
        if: always()
        shell: bash
        run: |
          docker rm -f spectra-codex-clean-host-inspect >/dev/null 2>&1 || true
          docker image rm -f "$INSPECT_IMAGE" >/dev/null 2>&1 || true
